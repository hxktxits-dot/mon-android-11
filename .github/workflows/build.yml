name: Compiler Android 11

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 1. Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: 2. Installer les outils
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 repo

      - name: 3. Télécharger Android 11 (Serveur GitHub direct)
        run: |
          mkdir -p ~/android11 && cd ~/android11
          git config --global user.name "Builder"
          git config --global user.email "builder@github.com"
          repo init -u https://github.com -b lineage-18.1 --depth=1 --git-lfs
          repo sync -c -j4 --no-tags --no-clone-bundle

      - name: 4. Appliquer tes modifications
        run: |
          cd ~/android11
          sed -i 's/lineage/MonSuperOS/g' vendor/lineage/config/common.mk || true

      - name: 5. Compiler Android 11
        run: |
          cd ~/android11
          source build/envsetup.sh
          lunch lineage_arm64-userdebug
          m -j$(nproc) systemimage

      - name: 6. Compresser le résultat
        run: |
          cd ~/android11/out/target/product/generic_arm64
          zip -r ~/Mon-Android-11.zip system.img

      - name: 7. Publier sur GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          files: ~/Mon-Android-11.zip
