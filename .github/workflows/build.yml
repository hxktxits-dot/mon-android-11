name: Compiler Android 11

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: 1. Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h

      - name: 2. Installer les outils
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 ccache
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: 3. Télécharger Android 11 (AOSP)
        run: |
          mkdir -p ~/android11 && cd ~/android11
          git config --global user.name "Builder"
          git config --global user.email "builder@github.com"
          git config --global color.ui false
          repo init -u https://android.googlesource.com/platform/manifest -b android-11.0.0_r48 --depth=1 --no-repo-verify
          repo sync -c -j4 --no-tags --no-clone-bundle --optimized-fetch

      - name: 4. Appliquer tes modifications
        run: |
          cd ~/android11
          cat >> build/make/target/product/aosp_arm64.mk <<'EOF'

          PRODUCT_BRAND := MonSuperOS
          PRODUCT_MODEL := MonSuperOS
          EOF

      - name: 5. Compiler Android 11
        run: |
          cd ~/android11
          export USE_CCACHE=1
          source build/envsetup.sh
          lunch aosp_arm64-userdebug
          m -j$(nproc) systemimage

      - name: 6. Compresser le résultat
        run: |
          cd ~/android11/out/target/product/generic_arm64
          zip -r $GITHUB_WORKSPACE/Mon-Android-11.zip system.img

      - name: 7. Publier sur GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          files: Mon-Android-11.zip
